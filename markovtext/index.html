<html>
    <head>
        <title>Markov Text</title>
        <link rel="stylesheet" href="/css/common.css">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div id="header_placeholder"></div>
        <div id="page_container">
            <span class="main_header">Markov Text</span>
            <span class="section_header"><b>Display</b> <span class="collapse" id="collapse_display">(Collapse)</span></span>
            <div id="display_container">
                <canvas id="markovCanvas" width="800" height="800"></canvas>
                <div class="settings_container">
                    <span class="settings_header">Display settings:</span>
                    <span class="setting">
                        <input type="checkbox" id="physics" checked>
                        <label for="physics">Physics</label>
                    </span>
                    <span class="setting">
                        <input type="checkbox" id="autozoom" checked>
                        <label for="autozoom">Zoom to fit</label>
                    </span>
                    <span class="setting">
                        <label for="node_text_select">Node text:</label>
                        <select name="node_text" id="node_text_select">
                            <option value="whole_context">Whole context</option>
                            <option value="last_elem">Last element</option>
                            <option value="none">None</option>
                        </select>
                    </span>
                </div>
            </div>
            <span class="section_header"><b>Focus info</b> <span class="collapse" id="collapse_focus">(Collapse)</span></span>
            <div id="focus_info">
                <span class="small_header">Current State</span>
                <div id="focus_header">
                    <strong id="focus_header_text"></strong>
                    <span id="focus_header_count"></span>
                </div>
                <div id="focus_scrolls">
                    <div class="scrollbox_container">
                        <span class="small_header">Preceding States</span>
                        <div class="scrollbox" id="focusLeft"></div>
                    </div>
                    <div class="scrollbox_container">
                        <span class="small_header">Following States</span>
                        <div class="scrollbox" id="focusRight"></div>
                    </div>
                </div>
            </div>
            <span class="section_header"><b>Input text</b></span>
            <div id="textbox" contenteditable="true">Type in this box</div>
            <div class="settings_container">
                <span class="settings_header">Parsing settings:</span>
                <span class="setting">
                    <label for="elem_select">Element type:</label>
                    <select name="elem" id="elem_select">
                        <option value="characters">Characters</option>
                        <option value="words">Words</option>
                    </select>
                </span>
                <span class="setting">
                    <input type="range" id="context_size_slider" min="1" max="5" value="3">
                    <label for="context_size_slider" id="context_size_label">Context window: 3 characters</label>
                </span>
            </div>
            <span class="section_header"><b>Output text</b></span>
            <div class="control_group">
                <div class="control">
                    <button class="big_button" id="start_random">Play</button>
                </div>
                <div class="control">
                    <button class="big_button" id="step_random">Step</button>
                </div>
                <div class="control">
                    <button class="big_button" id="reset_random">Reset</button>
                </div>
            </div>
            <div id="output"></div>
            <div class="settings_container">
                <span class="settings_header">Output settings:</span>
                <span class="setting">
                    <input type="range" id="random_speed" min="0" max="20" value="3">
                    <label for="random_speed" id="random_speed_label">Wait frames: 3</label>
                </span>
            </div>
        </div>
        <script src="/js/include_html.js"></script>
        <script src="js/markov.js"></script>
    </body>
</html>
