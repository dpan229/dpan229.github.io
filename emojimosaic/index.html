<!DOCTYPE html>
<html>
    <head>
        <title>Emoji Mosaic</title>
        <link rel="stylesheet" href="/css/common.css">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div id="header_placeholder"></div>
        <span class="main_header">Emoji Mosaic</span>
        <div class="canvas_container" id="main_canvas_container">
            <canvas class="layer_canvas" id="image_canvas" width="500" height="500"></canvas>
            <canvas class="layer_canvas" id="top_canvas" width="500" height="500"></canvas>
        </div>
        <div class="control_container">
            <div class="control_group">
                <div class="control">
                    <input type="range" min="0" max="100" value="70" id="emoji_opacity">
                    <br>
                    <label for="emoji_opacity">Emoji opacity: <span id="emoji_opacity_text">70</span>%</label>
                </div>
            </div>
        </div>
        <div class="control_container" id="grid_settings">
            <span class="container_heading">Input image</span>
            <div class="control_group">
                <div class="control">
                    <input type="file" id="image_input" accept="image/*">
                </div>
            </div>
            <span class="container_heading">Grid settings</span>
            <div class="control_group">
                <table>
                    <tr>
                        <td class="wide_cell">
                            <div class="control">
                                <input type="range" min="10" max="50" value="25" id="box_size">
                                <br>
                                <label for="box_size">Box size: <span id="box_size_text">25</span>px</label>
                            </div>
                        </td>
                        <td class="wide_cell">
                            <div class="control">
                                <input type="range" min="8" max="50" value="20" id="font_size">
                                <br>
                                <label for="font_size">Font size: <span id="font_size_text">20</span>px</label>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td class="wide_cell">
                            <div class="control">
                                <input type="range" min="-8" max="8" value="0" id="vertical_offset">
                                <br>
                                <label for="vertical_offset">Vertical offset: <span id="vertical_offset_text">0</span>px</label>
                            </div>
                        </td>
                        <td class="wide_cell">
                            <div class="control">
                                <input type="range" min="-8" max="8" value="0" id="horizontal_offset">
                                <br>
                                <label for="horizontal_offset">Horizontal offset: <span id="horizontal_offset_text">0</span>px</label>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
            <span class="container_heading">Comparison settings</span>
            <span class="container_subheading">For emoji's transparent pixels:</span>
            <div class="control_group">
                <div class="control">
                    <input type="radio" id="use_background" name="transparency" value="use_background" checked>
                    <label for="use_background">Use a background color</label>
                </div>
                <div class="control">
                    <input type="radio" id="average_transparent" name="transparency" value="average_transparent">
                    <label for="average_transparent">Use average score of opaque pixels</label>
                </div>
            </div>
            <div class="control_group" id="background_color_container">
                <div class="control">
                    Background color:
                    <input type="color" id="background_color_pick" value="#FFFFFF">
                </div>
            </div>
            <!-- convert emojis to grayscale -->
            <span class="container_heading">Emoji categories</span>
            <div class="control_group">
                <div class="control">
                    <input type="checkbox" id="people_checkbox" class="category_checkbox" data-category="PEOPLE" checked>
                    <label for="people_checkbox">People</label>
                </div>
                <div class="control">
                    <input type="checkbox" id="nature_checkbox" class="category_checkbox" data-category="NATURE" checked>
                    <label for="nature_checkbox">Nature</label>
                </div>
                <div class="control">
                    <input type="checkbox" id="food_checkbox" class="category_checkbox" data-category="FOOD" checked>
                    <label for="food_checkbox">Food</label>
                </div>
                <div class="control">
                    <input type="checkbox" id="objects_checkbox" class="category_checkbox" data-category="OBJECTS" checked>
                    <label for="objects_checkbox">Objects</label>
                </div>
                <div class="control">
                    <input type="checkbox" id="travel_checkbox" class="category_checkbox" data-category="TRAVELSPORTS" checked>
                    <label for="travel_checkbox">Travel & Sports</label>
                </div>
                <!-- <div class="control">
                    <input type="checkbox" id="space_checkbox" class="category_checkbox" data-category="SPACE" checked>
                    <label for="space_checkbox">Allow empty space</label>
                </div> -->
            </div>
            <span class="info" id="palette_count"></span>
        </div>

        <div class="control_container" id="click_info">
            <span class="container_heading">Selected box at comparison size:</span>
            <div class="control_group">
                <canvas id="click_info_canvas" width="45" height="45"></canvas>
            </div>
            <span class="container_heading">Best emojis for selected position:</span>
            <div id="table_container">

            </div>
        </div>

        <div class="control_group">
            <div class="control">
                <button id="go_button">Go</button>
            </div>
        </div>

        <div class="control_container" id="output_container">
            <span class="container_heading">Text Version:</span>
            <div id="output_text"></div>
        </div>
        <script src="/js/include_html.js"></script>
        <script src="js/emojimosaic.js"></script>
    </body>
</html>
